name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: 17
          distribution: temurin

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore tachiaz.jks \
            -alias tachiaz \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -dname "CN=TachiAZ, O=extsup" \
            -storepass tachiaz123 \
            -keypass tachiaz123
          echo "=== BASE64 OUTPUT ==="
          base64 tachiaz.jks

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: tachiaz-keystore
          path: tachiaz.jks
